# Python 3.14 and requirements.txt in a venv that is cached, keyed so that it cannot go stale for long:
# the exact Python patch, the requirements hash, the ISO week and a manual salt. requirements.txt pins with `>=`,
# so a venv frozen for good would hide upstream releases; the week in the key rebuilds it every Monday (avo 15 Nov
# 2026: a cache has to be changed now and then or it works against you). Bump the salt to force a rebuild today.
name: python-deps
description: Python 3.14 with the RevenueChaser requirements in a weekly cached venv
runs:
  using: composite
  steps:
    - id: py
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"
    - id: week
      shell: bash
      run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
    - id: venv
      uses: actions/cache@v4
      with:
        path: ~/rc-venv
        key: venv-v1-${{ runner.os }}-${{ steps.py.outputs.python-version }}-${{ hashFiles('RevenueChaser/requirements.txt') }}-${{ steps.week.outputs.week }}
    - if: steps.venv.outputs.cache-hit != 'true'
      shell: bash
      run: python -m venv ~/rc-venv && ~/rc-venv/bin/pip install -r RevenueChaser/requirements.txt
    - shell: bash
      run: echo "$HOME/rc-venv/bin" >> "$GITHUB_PATH"
